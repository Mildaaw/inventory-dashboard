<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Inventory Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff7eb3, #7f7eff);
  color: #333;
  padding: 20px;
}

h1 {
  text-align: center;
  color: white;
  margin-bottom: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

.cards {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 200px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

.card h3 {
  margin-bottom: 10px;
}

.card p {
  font-size: 24px;
  font-weight: bold;
  color: #7f7eff;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #7f7eff;
  color: white;
}

th, td {
  padding: 10px;
  text-align: left;
}

tr:hover {
  background: #f1f1ff;
}

canvas {
  max-height: 300px;
}
</style>
</head>

<body>

<h1>?? Inventory Dashboard</h1>

<div class="container">

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Total Barang</h3>
      <p id="totalBarang">0</p>
    </div>
    <div class="card">
      <h3>Total Stok</h3>
      <p id="totalStok">0</p>
    </div>
  </div>

  <!-- STOK -->
  <div class="section">
    <h2>?? Stok Barang</h2>
    <table id="stokTable">
      <thead>
        <tr>
          <th>Barang</th>
          <th>Stok</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- CHART -->
  <div class="section">
    <h2>?? Grafik Stok</h2>
    <canvas id="chart"></canvas>
  </div>

  <!-- TRANSAKSI -->
  <div class="section">
    <h2>?? Riwayat Transaksi</h2>
    <table id="transaksiTable">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Barang</th>
          <th>Jenis</th>
          <th>Jumlah</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
const SHEET_ID = "1xKNt9b9TiVshSkdC8E6Ae6vJ0mrhhkzUfFCFR5mF6ak";

// ?? LOAD STOK
async function loadStok() {
  const url = `https://opensheet.elk.sh/${SHEET_ID}/Stok`;
  const res = await fetch(url);
  const data = await res.json();

  let table = document.querySelector("#stokTable tbody");
  table.innerHTML = "";

  let totalBarang = data.length;
  let totalStok = 0;

  let labels = [];
  let values = [];

  data.forEach(row => {
    let stok = Number(row.Stok);
    totalStok += stok;

    table.innerHTML += `
      <tr>
        <td>${row.Barang}</td>
        <td>${stok}</td>
      </tr>
    `;

    labels.push(row.Barang);
    values.push(stok);
  });

  document.getElementById("totalBarang").innerText = totalBarang;
  document.getElementById("totalStok").innerText = totalStok;

  renderChart(labels, values);
}

// ?? CHART
let chart;
function renderChart(labels, data) {
  if (chart) chart.destroy();

  const ctx = document.getElementById("chart");

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Stok',
        data: data,
        borderRadius: 8
      }]
    },
    options: {
      plugins: {
        legend: { display: false }
      }
    }
  });
}

// ?? LOAD TRANSAKSI
async function loadTransaksi() {
  const url = `https://opensheet.elk.sh/${SHEET_ID}/Transaksi`;
  const res = await fetch(url);
  const data = await res.json();

  let table = document.querySelector("#transaksiTable tbody");
  table.innerHTML = "";

  data.reverse().forEach(row => {
    table.innerHTML += `
      <tr>
        <td>${row.Tanggal}</td>
        <td>${row.Barang}</td>
        <td>${row.Jenis}</td>
        <td>${row.Jumlah}</td>
      </tr>
    `;
  });
}

// ?? LOAD SEMUA
function loadAll() {
  loadStok();
  loadTransaksi();
}

loadAll();

// ?? AUTO REFRESH
setInterval(loadAll, 5000);
</script>

</body>
</html>
